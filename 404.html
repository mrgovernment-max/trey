<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — OJ || studios</title>
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/dazhskqcc/image/upload/v1774111948/ojlogo_mfmfqv.png"
    />
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface-page, #fafaf8);
        color: var(--text-primary, #232321);
        font-family: var(--font-sans, system-ui, sans-serif);
        padding: var(--space-5, 1.5rem);
      }

      .nf {
        text-align: center;
        max-width: 32rem;
      }

      .nf-code {
        font-size: clamp(4rem, 18vw, 8rem);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--color-gold, #c9a46c);
        margin: 0;
      }

      .nf-logo {
        font-size: 1.1rem;
        letter-spacing: 0.02em;
        color: var(--text-secondary, #6f6f69);
        margin-bottom: var(--space-5, 1.5rem);
      }

      .nf h1 {
        font-size: 1.35rem;
        font-weight: 500;
        margin: var(--space-4, 1rem) 0 var(--space-3, 0.75rem);
      }

      .nf p {
        color: var(--text-secondary, #6f6f69);
        line-height: 1.7;
        margin: 0 0 var(--space-6, 2rem);
        font-size: 0.95rem;
      }

      .nf-actions {
        display: flex;
        gap: var(--space-3, 0.75rem);
        justify-content: center;
        flex-wrap: wrap;
      }

      .nf-btn {
        display: inline-block;
        padding: 0.85rem 1.75rem;
        border-radius: 999px;
        text-decoration: none;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        text-transform: lowercase;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .nf-btn--solid {
        background: var(--surface-dark, #232321);
        color: var(--text-on-dark, #fafaf8);
      }

      .nf-btn--solid:hover {
        background: var(--color-gold, #c9a46c);
      }

      .nf-btn--ghost {
        border: 1px solid var(--border-default, #d4d4ce);
        color: var(--text-primary, #232321);
      }

      .nf-btn--ghost:hover {
        border-color: var(--color-gold, #c9a46c);
        color: var(--color-gold, #c9a46c);
      }
    </style>
  </head>
  <body>
    <main class="nf">
      <div class="nf-logo">OJ || studios</div>
      <p class="nf-code">404</p>
      <h1>this page isn't in the collection</h1>
      <p>
        the link may be out of date, or the piece may have sold out. everything
        currently in stock is one click away.
      </p>
      <div class="nf-actions">
        <a class="nf-btn nf-btn--solid" href="/index.html#products"
          >browse the collection</a
        >
        <a class="nf-btn nf-btn--ghost" href="/index.html">back to home</a>
      </div>
    </main>
  </body>
</html>
