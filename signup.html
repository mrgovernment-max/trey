<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- EmailJS -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OJ || studios · Register Account</title>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      /* Your existing styles remain exactly the same */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        background: #fafaf8;
        color: #1e1e1e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1.5rem;
        margin: 0;
        line-height: 1.5;
        background-image: radial-gradient(
            circle at 10% 30%,
            rgba(0, 0, 0, 0.02) 0%,
            transparent 30%
          ),
          radial-gradient(
            circle at 90% 70%,
            rgba(0, 0, 0, 0.02) 0%,
            transparent 30%
          );
        animation: bgFade 1.2s ease;
      }

      @keyframes bgFade {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .register-card {
        background: #ffffff;
        border: 1px solid #eaeae4;
        width: 95%;
        max-width: 500px;
        padding: 2.8rem 2.5rem;
        box-shadow: 0 25px 45px -20px rgba(0, 0, 0, 0.08);
        transition: box-shadow 0.4s ease, transform 0.3s ease;
        animation: cardAppear 0.7s cubic-bezier(0.12, 0.71, 0.33, 1);
      }

      .register-card:hover {
        box-shadow: 0 30px 50px -25px rgba(0, 0, 0, 0.12);
      }

      @keyframes cardAppear {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand-header {
        margin-bottom: 2.5rem;
        text-align: left;
        border-bottom: 1px solid #efefe9;
        padding-bottom: 1.2rem;
      }

      .brand-logo {
        font-size: 2rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #252523;
        line-height: 1;
      }

      .brand-logo span {
        font-weight: 280;
        color: #7c7c7a;
      }

      .brand-tagline {
        font-size: 0.9rem;
        font-weight: 320;
        color: #6f6f69;
        margin-top: 0.3rem;
        letter-spacing: 0.3px;
      }

      .form-title {
        font-size: 1.6rem;
        font-weight: 380;
        letter-spacing: -0.02em;
        color: #252523;
        margin-bottom: 0.2rem;
      }

      .form-sub {
        font-size: 0.95rem;
        color: #6b6b66;
        font-weight: 320;
        margin-bottom: 2rem;
        border-left: 2px solid #d4d4ce;
        padding-left: 1rem;
      }

      .trey-form {
        display: flex;
        flex-direction: column;
        gap: 1.8rem;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .input-label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: #4a4a46;
        font-weight: 400;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .input-label i {
        font-size: 0.9rem;
        color: #b5b5ad;
        width: 18px;
      }

      .input-field {
        background: transparent;
        border: none;
        border-bottom: 1px solid #d7d7d0;
        padding: 0.7rem 0.2rem 0.7rem 0.2rem;
        font-size: 1.1rem;
        font-weight: 320;
        color: #232321;
        outline: none;
        transition: border-color 0.2s, background 0.2s;
        font-family: inherit;
        width: 100%;
      }

      .input-field:focus {
        border-bottom-color: #232321;
        background: #fcfcf9;
      }

      .input-field::placeholder {
        color: #c3c3bb;
        font-weight: 280;
        font-size: 0.95rem;
      }

      .register-btn {
        background: #232321;
        border: 1px solid #232321;
        color: white;
        padding: 1.1rem 1.5rem;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 2.2px;
        font-weight: 400;
        cursor: pointer;
        transition: all 0.25s ease;
        margin: 0.8rem 0 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: 0;
        position: relative;
        overflow: hidden;
      }

      .register-btn:hover {
        background: #3b3b38;
        border-color: #3b3b38;
      }

      .register-btn:active {
        transform: scale(0.98);
      }

      .register-btn i {
        transition: transform 0.2s;
      }

      .register-btn:hover i {
        transform: translateX(4px);
      }

      .response-area {
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        font-size: 0.95rem;
        font-weight: 340;
        border: 1px solid #efefe9;
        background: #f9f9f6;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #3b3b38;
        transition: all 0.2s;
        min-height: 60px;
      }

      .response-area i {
        font-size: 1.2rem;
        color: #b5b5ad;
      }

      .response-area.success {
        border-left: 4px solid #c9a46c;
        background: #fcf9f5;
      }

      .response-area.error {
        border-left: 4px solid #d86767;
        background: #fdf8f8;
      }

      .legal-note {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: #a3a39b;
        text-align: center;
        border-top: 1px solid #efefe9;
        padding-top: 1.2rem;
        letter-spacing: 0.3px;
      }

      .legal-note a {
        color: #6b6b64;
        text-decoration: none;
        border-bottom: 1px dotted #cbcbc3;
      }

      .legal-note a:hover {
        color: #232321;
        border-bottom: 1px solid #232321;
      }

      @keyframes softPulse {
        0% {
          opacity: 0.3;
        }
        50% {
          opacity: 0.6;
        }
        100% {
          opacity: 0.3;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-spinner {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .spinner-small {
        width: 18px;
        height: 18px;
        border: 2px solid #e2e2db;
        border-top-color: #c9a46c;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      @media (max-width: 480px) {
        .register-card {
          padding: 2rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="register-card">
      <div class="brand-header">
        <div class="brand-logo">OJ || studios</div>
        <div class="brand-tagline">functional aesthetics · member access</div>
      </div>

      <div class="form-title">create account</div>
      <div class="form-sub">join the OJ || studios community</div>

      <form id="registerForm" class="trey-form">
        <div class="input-group">
          <label for="first_name" class="input-label"
            ><i class="fa-regular fa-user"></i> first name</label
          >
          <input
            type="text"
            id="first_name"
            placeholder="e.g. James"
            class="input-field"
            required
          />
        </div>

        <div class="input-group">
          <label for="surname" class="input-label"
            ><i class="fa-regular fa-user"></i> surname</label
          >
          <input
            type="text"
            id="surname"
            placeholder="e.g. Wright"
            class="input-field"
            required
          />
        </div>

        <div class="input-group">
          <label for="email" class="input-label"
            ><i class="fa-regular fa-envelope"></i> email</label
          >
          <input
            type="email"
            id="email"
            placeholder="hello@trey.studio"
            class="input-field"
            required
          />
        </div>

        <div class="input-group">
          <label for="password" class="input-label"
            ><i class="fa-solid fa-lock"></i> password</label
          >
          <input
            type="password"
            id="password"
            placeholder="··········"
            class="input-field"
            required
          />
        </div>

        <button type="submit" class="register-btn">
          register <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>

        <div id="response" class="response-area">
          <i class="fa-solid fa-circle" style="color: rgb(240, 240, 30)"></i>
          <span>ready to register</span>
        </div>
      </form>

      <div class="legal-note">
        by joining you agree to our <a href="#">terms</a> and
        <a href="#">privacy</a><br /><a href="login.html">Login?</a>
      </div>
    </div>

    <script>
      // ========================================
      // INITIALIZE EMAILJS
      // ========================================
      (function initEmailJS() {
        emailjs.init("9njw5PNNC3JuIC3ot");
        console.log("EmailJS initialized");
      })();

      // ========================================
      // EMAIL SENDING FUNCTIONS
      // ========================================

      // Send Welcome Email to User
      async function sendWelcomeEmail(firstName, userEmail) {
        const templateParams = {
          first_name: firstName,
          to_email: userEmail,
        };

        try {
          await emailjs.send(
            "service_upc9ola", // Your Service ID
            "template_sejt2l8", // Your Welcome Email Template ID
            templateParams
          );
          console.log("✅ Welcome email sent to:", userEmail);
          return true;
        } catch (error) {
          console.error("❌ Welcome email failed:", error);
          return false;
        }
      }

      // Send Admin Notification Email
      async function sendAdminNotification(firstName, surname, email, userId) {
        const templateParams = {
          first_name: firstName,
          surname: surname,
          email: email,
          user_id: userId,
          registered_date: new Date().toLocaleString(),
          to_email: "supportblacksheep@gmail.com",
        };

        try {
          await emailjs.send(
            "service_upc9ola",
            "template_2e4b8h9",
            templateParams
          );
          console.log("✅ Admin notification sent");
          return true;
        } catch (error) {
          console.error("❌ Admin notification failed:", error);
          return false;
        }
      }

      // ========================================
      // FORM SUBMISSION HANDLER
      // ========================================

      const form = document.getElementById("registerForm");
      const responseDiv = document.getElementById("response");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const userData = {
          first_name: document.getElementById("first_name").value,
          surname: document.getElementById("surname").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        };

        // Show loading state
        responseDiv.classList.remove("success", "error");
        responseDiv.innerHTML = `
          <div class="loading-spinner">
            <div class="spinner-small"></div>
            <span>creating your account...</span>
          </div>
        `;

        try {
          // 1. Register user with backend
          const res = await fetch(
            "https://backendroutes-lcpt.onrender.com/register",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(userData),
            }
          );

          const result = await res.json();

          if (res.ok) {
            // 2. Send Welcome Email to User
            await sendWelcomeEmail(userData.first_name, userData.email);

            // 3. Send Admin Notification
            await sendAdminNotification(
              userData.first_name,
              userData.surname,
              userData.email,
              result.userId
            );

            // Success message
            responseDiv.style.color = "#c9a46c";
            responseDiv.innerHTML = `<i class="fa-regular fa-circle-check" style="color:#c9a46c;"></i> <span>✅ ${result.message} (ID: ${result.userId})</span>`;
            responseDiv.classList.add("success");
            form.reset();
          } else {
            responseDiv.style.color = "#ff5555";
            responseDiv.innerHTML = `<i class="fa-regular fa-circle-exclamation" style="color:#ff5555;"></i> <span>❌ ${result.message}</span>`;
            responseDiv.classList.add("error");
          }
        } catch (err) {
          responseDiv.style.color = "#ff5555";
          responseDiv.innerHTML = `<i class="fa-regular fa-circle-exclamation" style="color:#ff5555;"></i> <span>❌ Error connecting to server</span>`;
          responseDiv.classList.add("error");
          console.error("Registration error:", err);
        }
      });
    </script>
  </body>
</html>
