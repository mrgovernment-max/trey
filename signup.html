<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- EmailJS -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
    ></script>
    <!-- Vercel Speed Insights -->
    <script type="module">
      import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@1/+esm';
      injectSpeedInsights();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OJ || studios · Register Account</title>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="theme.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background: var(--surface-page);
        color: var(--text-primary);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: var(--space-5);
        line-height: 1.5;
        background-image: radial-gradient(
            circle at 10% 30%,
            rgba(30, 30, 30, 0.03) 0%,
            transparent 30%
          ),
          radial-gradient(
            circle at 90% 70%,
            rgba(201, 164, 108, 0.07) 0%,
            transparent 35%
          );
        animation: bgFade 1.2s var(--ease-out);
      }

      @keyframes bgFade {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .register-card {
        background: var(--surface-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        width: 95%;
        max-width: 500px;
        padding: var(--space-7) var(--space-6);
        box-shadow: var(--shadow-lg);
        transition: box-shadow var(--transition-slow), transform var(--transition-base);
        animation: cardAppear 0.7s var(--ease-out);
      }

      .register-card:hover {
        box-shadow: var(--shadow-lg), var(--shadow-gold);
      }

      @keyframes cardAppear {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand-header {
        margin-bottom: var(--space-6);
        text-align: left;
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: var(--space-4);
      }

      .brand-logo {
        font-size: 2rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        line-height: 1;
      }

      .brand-logo span {
        font-weight: 400;
        color: var(--text-muted);
      }

      .brand-tagline {
        font-size: 0.9rem;
        font-weight: 400;
        color: var(--text-secondary);
        margin-top: var(--space-1);
        letter-spacing: 0.3px;
      }

      .form-title {
        font-size: 1.6rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        margin-bottom: var(--space-1);
      }

      .form-sub {
        font-size: 0.95rem;
        color: var(--text-secondary);
        font-weight: 400;
        margin-bottom: var(--space-6);
        border-left: 2px solid var(--color-gold);
        padding-left: var(--space-4);
      }

      .trey-form {
        display: flex;
        flex-direction: column;
        gap: var(--space-5);
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }

      .input-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-secondary);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .input-label i {
        font-size: 0.9rem;
        color: var(--color-gold);
        width: 18px;
      }

      .input-field {
        background: var(--surface-sunken);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        padding: 0.85rem 1rem;
        font-size: 1rem;
        font-weight: 400;
        color: var(--text-primary);
        outline: none;
        transition: border-color var(--transition-fast), background var(--transition-fast),
          box-shadow var(--transition-fast);
        font-family: inherit;
        width: 100%;
      }

      .input-field:hover {
        border-color: var(--color-gray-300);
      }

      .input-field:focus {
        border-color: var(--color-gold);
        background: var(--surface-card);
        box-shadow: var(--focus-ring);
      }

      .input-field::placeholder {
        color: var(--text-muted);
        font-weight: 400;
        font-size: 0.95rem;
      }

      .password-field {
        position: relative;
      }

      .password-field .input-field {
        padding-right: 2.75rem;
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 0.4rem;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: var(--text-muted);
        width: 2.25rem;
        height: 2.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: color var(--transition-fast), background var(--transition-fast);
      }

      .password-toggle:hover {
        color: var(--color-ink-800);
        background: var(--surface-sunken);
      }

      .register-btn {
        background: var(--color-ink-800);
        border: 1px solid var(--color-ink-800);
        color: var(--text-on-dark);
        padding: 1rem 1.5rem;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
        cursor: pointer;
        transition: background var(--transition-base), border-color var(--transition-base),
          box-shadow var(--transition-base), transform var(--transition-fast);
        margin: var(--space-2) 0 var(--space-1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: var(--radius-pill);
        position: relative;
        overflow: hidden;
      }

      .register-btn:hover {
        background: var(--color-gold);
        border-color: var(--color-gold);
        color: var(--color-ink-800);
        box-shadow: var(--shadow-gold);
      }

      .register-btn:active {
        transform: scale(0.98);
      }

      .register-btn i {
        transition: transform var(--transition-fast);
      }

      .register-btn:hover i {
        transform: translateX(4px);
      }

      .response-area {
        margin-top: var(--space-4);
        padding: var(--space-4);
        font-size: 0.95rem;
        font-weight: 400;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        background: var(--surface-sunken);
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-secondary);
        transition: border-color var(--transition-base), background var(--transition-base),
          color var(--transition-base);
        min-height: 60px;
      }

      .response-area i {
        font-size: 1.2rem;
        color: var(--color-gray-300);
      }

      .response-area.success {
        border-color: var(--color-success);
        background: var(--color-success-bg);
        color: var(--color-success);
      }

      .response-area.error {
        border-color: var(--color-error);
        background: var(--color-error-bg);
        color: var(--color-error);
      }

      .legal-note {
        margin-top: var(--space-6);
        font-size: 0.8rem;
        color: var(--text-muted);
        text-align: center;
        border-top: 1px solid var(--border-subtle);
        padding-top: var(--space-4);
        letter-spacing: 0.3px;
      }

      .legal-note a {
        color: var(--text-secondary);
        text-decoration: none;
        border-bottom: 1px dotted var(--border-default);
      }

      .legal-note a:hover {
        color: var(--color-gold-dark);
        border-bottom: 1px solid var(--color-gold-dark);
      }

      @keyframes softPulse {
        0% {
          opacity: 0.3;
        }
        50% {
          opacity: 0.6;
        }
        100% {
          opacity: 0.3;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-spinner {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .spinner-small {
        width: 18px;
        height: 18px;
        border: 2px solid var(--border-default);
        border-top-color: var(--color-gold);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      /* responsive */
      @media (max-width: 480px) {
        .register-card {
          padding: var(--space-6) var(--space-4);
        }

        .brand-logo {
          font-size: 1.6rem;
        }

        .form-title {
          font-size: 1.35rem;
        }
      }

      @media (max-width: 360px) {
        .register-card {
          padding: var(--space-5) var(--space-3);
        }
      }
    </style>
  </head>
  <body>
    <div class="register-card">
      <div class="brand-header">
        <div class="brand-logo">OJ || studios</div>
        <div class="brand-tagline">functional aesthetics · member access</div>
      </div>

      <div class="form-title">create account</div>
      <div class="form-sub">join the OJ || studios community</div>

      <form id="registerForm" class="trey-form">
        <div class="input-group">
          <label for="first_name" class="input-label"
            ><i class="fa-regular fa-user"></i> first name</label
          >
          <input
            type="text"
            id="first_name"
            placeholder="e.g. James"
            class="input-field"
            autocomplete="given-name"
            required
          />
        </div>

        <div class="input-group">
          <label for="surname" class="input-label"
            ><i class="fa-regular fa-user"></i> surname</label
          >
          <input
            type="text"
            id="surname"
            placeholder="e.g. Wright"
            class="input-field"
            autocomplete="family-name"
            required
          />
        </div>

        <div class="input-group">
          <label for="email" class="input-label"
            ><i class="fa-regular fa-envelope"></i> email</label
          >
          <input
            type="email"
            id="email"
            placeholder="hello@trey.studio"
            class="input-field"
            autocomplete="email"
            required
          />
        </div>

        <div class="input-group">
          <label for="password" class="input-label"
            ><i class="fa-solid fa-lock"></i> password</label
          >
          <div class="password-field">
            <input
              type="password"
              id="password"
              placeholder="··········"
              class="input-field"
              minlength="8"
              autocomplete="new-password"
              aria-describedby="password-hint"
              required
            />
            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="Show password"
              aria-pressed="false"
            >
              <i class="fa-regular fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <p id="password-hint" class="input-hint">at least 8 characters</p>
        </div>

        <button type="submit" class="register-btn">
          register <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>

        <div id="response" class="response-area">
          <i class="fa-solid fa-circle" style="color: var(--color-gray-300)"></i>
          <span>ready to register</span>
        </div>
      </form>

      <div class="legal-note">
        by joining you agree to our <a href="index.html#terms">terms</a> and
        <a href="index.html#policy">privacy</a><br /><a href="login.html">Login?</a>
      </div>
    </div>

    <script src="app-core.js"></script>
    <script>
      //
      // COMPLETE REGISTRATION WITH BOTH EMAILS
      //

      // Initialize EmailJS
      (function initEmailJS() {
        emailjs.init("9njw5PNNC3JuIC3ot");
        console.log("EmailJS initialized");
      })();

      // Send Welcome Email to USER
      async function sendWelcomeEmail(firstName, userEmail) {
        const templateParams = {
          first_name: firstName,
          to_email: userEmail,
        };

        try {
          await emailjs.send(
            "service_upc9ola",
            "template_8egktbo",
            templateParams
          );
          console.log("✅ Welcome email sent to user:", userEmail);
          return true;
        } catch (error) {
          console.error("❌ Welcome email failed:", error);
          return false;
        }
      }

      async function sendAdminNotification(
        firstName,
        surname,
        userEmail,
        userId
      ) {
        const templateParams = {
          first_name: firstName,
          surname: surname,
          email: userEmail,
          user_id: userId,
          registered_date: new Date().toLocaleString(),
        };

        try {
          await emailjs.send(
            "service_upc9ola",
            "template_a4wvz2h",
            templateParams
          );
          console.log(
            "✅ Admin notification sent to supportblacksheep@gmail.com"
          );
          return true;
        } catch (error) {
          console.error("❌ Admin notification failed:", error);
          return false;
        }
      }

      //
      // FORM SUBMISSION
      //

      const form = document.getElementById("registerForm");
      const responseDiv = document.getElementById("response");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const userData = {
          first_name: document.getElementById("first_name").value.trim(),
          surname: document.getElementById("surname").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        };

        // validate before spending a round trip on it
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userData.email)) {
          responseDiv.className = "error";
          responseDiv.innerHTML =
            '<i class="fa-regular fa-circle-exclamation" style="color:#ff5555;"></i> <span>please enter a valid email address</span>';
          return;
        }
        if (userData.password.length < 8) {
          responseDiv.className = "error";
          responseDiv.innerHTML =
            '<i class="fa-regular fa-circle-exclamation" style="color:#ff5555;"></i> <span>password must be at least 8 characters</span>';
          document.getElementById("password").focus();
          return;
        }

        // Show loading state
        responseDiv.classList.remove("success", "error");
        responseDiv.innerHTML = `
        <div class="loading-spinner">
            <div class="spinner-small"></div>
            <span>creating your account...</span>
        </div>
    `;

        try {
          const res = await fetch(
            "https://backendroutes-lcpt.onrender.com/register",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(userData),
            }
          );

          const result = await res.json();

          if (res.ok) {
            // Send Welcome Email to USER
            await sendWelcomeEmail(userData.first_name, userData.email);

            // Send Admin Notification admin
            await sendAdminNotification(
              userData.first_name,
              userData.surname,
              userData.email,
              result.userId
            );

            // Success message
            responseDiv.style.color = "#c9a46c";
            responseDiv.innerHTML = `<i class="fa-regular fa-circle-check" style="color:#c9a46c;"></i> <span>✅ ${OJ.escapeHtml(result.message)}</span>`;
            responseDiv.classList.add("success");
            form.reset();
          } else {
            responseDiv.style.color = "#ff5555";
            responseDiv.innerHTML = `<i class="fa-regular fa-circle-exclamation" style="color:#ff5555;"></i> <span>❌ ${OJ.escapeHtml(result.message)}</span>`;
            responseDiv.classList.add("error");
          }
        } catch (err) {
          responseDiv.style.color = "#ff5555";
          responseDiv.innerHTML = `<i class="fa-regular fa-circle-exclamation" style="color:#ff5555;"></i> <span>❌ Error connecting to server</span>`;
          responseDiv.classList.add("error");
          console.error("Registration error:", err);
        }
      });

      // --- Password visibility toggle (additive, does not touch the form-submit logic above) ---
      (function () {
        const toggleBtn = document.getElementById("passwordToggle");
        const passwordInput = document.getElementById("password");
        if (!toggleBtn || !passwordInput) return;

        toggleBtn.addEventListener("click", () => {
          const isHidden = passwordInput.type === "password";
          passwordInput.type = isHidden ? "text" : "password";

          const icon = toggleBtn.querySelector("i");
          if (icon) {
            icon.classList.toggle("fa-eye", !isHidden);
            icon.classList.toggle("fa-eye-slash", isHidden);
          }

          toggleBtn.setAttribute("aria-pressed", String(isHidden));
          toggleBtn.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password"
          );
        });
      })();
    </script>
  </body>
</html>
