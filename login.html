<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Vercel Speed Insights -->
    <script type="module">
      import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@1/+esm';
      injectSpeedInsights();
    </script>
    <title>TREY · sign in</title>
    <!-- Font Awesome for subtle icons (adds polish without changing logic) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="theme.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background: var(--surface-page);
        color: var(--text-primary);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: var(--space-5);
        line-height: 1.5;
        background-image: radial-gradient(
            circle at 20% 40%,
            rgba(30, 30, 30, 0.03) 0%,
            transparent 30%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(201, 164, 108, 0.07) 0%,
            transparent 35%
          );
        animation: bgFade 1.2s var(--ease-out);
      }

      @keyframes bgFade {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .signin-card {
        background: var(--surface-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        width: 95%;
        max-width: 440px;
        padding: var(--space-7) var(--space-6);
        box-shadow: var(--shadow-lg);
        transition: box-shadow var(--transition-slow), transform var(--transition-base);
        animation: cardAppear 0.7s var(--ease-out);
      }

      .signin-card:hover {
        box-shadow: var(--shadow-lg), var(--shadow-gold);
      }

      @keyframes cardAppear {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand-header {
        margin-bottom: var(--space-6);
        text-align: left;
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: var(--space-4);
      }

      .brand-logo {
        font-size: 2rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        line-height: 1;
      }

      .brand-logo span {
        font-weight: 400;
        color: var(--text-muted);
      }

      .brand-tagline {
        font-size: 0.9rem;
        font-weight: 400;
        color: var(--text-secondary);
        margin-top: var(--space-1);
        letter-spacing: 0.3px;
      }

      .form-title {
        font-size: 1.6rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        margin-bottom: var(--space-1);
      }

      .form-sub {
        font-size: 0.95rem;
        color: var(--text-secondary);
        font-weight: 400;
        margin-bottom: var(--space-6);
        border-left: 2px solid var(--color-gold);
        padding-left: var(--space-4);
      }

      .trey-form {
        display: flex;
        flex-direction: column;
        gap: var(--space-5);
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }

      .input-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-secondary);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .input-label i {
        font-size: 0.9rem;
        color: var(--color-gold);
        width: 18px;
      }

      .input-field {
        background: var(--surface-sunken);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        padding: 0.85rem 1rem;
        font-size: 1rem;
        font-weight: 400;
        color: var(--text-primary);
        outline: none;
        transition: border-color var(--transition-fast), background var(--transition-fast),
          box-shadow var(--transition-fast);
        font-family: inherit;
        width: 100%;
      }

      .input-field:hover {
        border-color: var(--color-gray-300);
      }

      .input-field:focus {
        border-color: var(--color-gold);
        background: var(--surface-card);
        box-shadow: var(--focus-ring);
      }

      .input-field::placeholder {
        color: var(--text-muted);
        font-weight: 400;
        font-size: 0.95rem;
      }

      .password-field {
        position: relative;
      }

      .password-field .input-field {
        padding-right: 2.75rem;
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 0.4rem;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: var(--text-muted);
        width: 2.25rem;
        height: 2.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: color var(--transition-fast), background var(--transition-fast);
      }

      .password-toggle:hover {
        color: var(--color-ink-800);
        background: var(--surface-sunken);
      }

      .signin-btn {
        background: var(--color-ink-800);
        border: 1px solid var(--color-ink-800);
        color: var(--text-on-dark);
        padding: 1rem 1.5rem;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
        cursor: pointer;
        transition: background var(--transition-base), border-color var(--transition-base),
          box-shadow var(--transition-base), transform var(--transition-fast);
        margin: var(--space-2) 0 var(--space-1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: var(--radius-pill);
        position: relative;
        overflow: hidden;
      }

      .signin-btn:hover {
        background: var(--color-gold);
        border-color: var(--color-gold);
        color: var(--color-ink-800);
        box-shadow: var(--shadow-gold);
      }

      .signin-btn:active {
        transform: scale(0.98);
      }

      .signin-btn i {
        transition: transform var(--transition-fast);
      }

      .signin-btn:hover i {
        transform: translateX(4px);
      }

      .status-area {
        margin-top: var(--space-5);
        padding: var(--space-4);
        font-size: 0.95rem;
        font-weight: 400;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        background: var(--surface-sunken);
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-secondary);
        transition: border-color var(--transition-base), background var(--transition-base),
          color var(--transition-base);
        min-height: 60px;
      }

      .status-area i {
        font-size: 1.2rem;
        color: var(--color-gray-300);
      }

      .status-area.success {
        border-color: var(--color-success);
        background: var(--color-success-bg);
        color: var(--color-success);
      }

      .status-area.error {
        border-color: var(--color-error);
        background: var(--color-error-bg);
        color: var(--color-error);
      }

      .legal-note {
        margin-top: var(--space-6);
        font-size: 0.8rem;
        color: var(--text-muted);
        text-align: center;
        border-top: 1px solid var(--border-subtle);
        padding-top: var(--space-4);
        letter-spacing: 0.3px;
      }

      .legal-note a {
        color: var(--text-secondary);
        text-decoration: none;
        border-bottom: 1px dotted var(--border-default);
      }

      .legal-note a:hover {
        color: var(--color-gold-dark);
        border-bottom: 1px solid var(--color-gold-dark);
      }

      .forgot-link {
        text-align: right;
        margin-top: -0.6rem;
        font-size: 0.85rem;
      }

      .forgot-link a {
        color: var(--text-muted);
        text-decoration: none;
        border-bottom: 1px dotted var(--border-default);
      }

      .forgot-link a:hover {
        color: var(--color-gold-dark);
      }

      /* responsive */
      @media (max-width: 480px) {
        .signin-card {
          padding: var(--space-6) var(--space-4);
        }

        .brand-logo {
          font-size: 1.6rem;
        }

        .form-title {
          font-size: 1.35rem;
        }
      }

      @media (max-width: 360px) {
        .signin-card {
          padding: var(--space-5) var(--space-3);
        }
      }
    </style>
  </head>
  <body>
    <div class="signin-card">
      <div class="brand-header">
        <div class="brand-logo">OJ || studios</div>
        <div class="brand-tagline">first acess merch · member access</div>
      </div>

      <div class="form-title">welcome back</div>
      <div class="form-sub">sign in to your account</div>

      <form id="loginForm" class="trey-form">
        <div class="input-group">
          <label for="email" class="input-label"
            ><i class="fa-regular fa-envelope"></i> email</label
          >
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your@email.com"
            class="input-field"
            required
          />
        </div>

        <div class="input-group">
          <label for="password" class="input-label"
            ><i class="fa-solid fa-lock"></i>password</label
          >
          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="··········"
              class="input-field"
              required
            />
            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="Show password"
              aria-pressed="false"
            >
              <i class="fa-regular fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="forgot-link">
          <a href="signup.html">Sign Up?</a>
        </div>

        <button type="submit" class="signin-btn">
          sign in <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>

        <div id="status" class="status-area">
          <i class="fa-solid fa-circle" style="color: var(--color-gray-300)"></i>
          <span>ready to sign in</span>
        </div>
      </form>

      <div class="legal-note">
        secure access · <a href="index.html#policy">privacy</a> · <a href="index.html#contact">help</a>
      </div>
    </div>

    <script src="app-core.js"></script>
    <script>
      const form = document.getElementById("loginForm");
      const statusDiv = document.getElementById("status");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        statusDiv.classList.remove("success", "error");

        const formData = new FormData(form);
        const data = {
          email: formData.get("email"),
          password: formData.get("password"),
        };

        try {
          const res = await fetch(
            "https://backendroutes-lcpt.onrender.com/loginoj",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            }
          );

          const result = await res.json();

          statusDiv.textContent = result.message;

          if (res.ok) {
            sessionStorage.setItem("isLoggedIn", "yes");
            sessionStorage.setItem("userId", result.userId);
            sessionStorage.setItem("userName", result.userName);
            statusDiv.classList.add("success");
            statusDiv.innerHTML = `<i class="fa-regular fa-circle-check" style="color:#c9a46c;"></i> <span>${result.message}</span>`;
            setTimeout(() => {
              window.location.href = "index.html";
            }, 2000);
          } else {
            statusDiv.classList.add("error");
            statusDiv.innerHTML = `<i class="fa-regular fa-circle-exclamation" style="color:#d86767;"></i> <span>${result.message}</span>`;
          }
        } catch (err) {
          console.error(err);
          statusDiv.classList.add("error");
          statusDiv.innerHTML = `<i class="fa-regular fa-circle-exclamation" style="color:#d86767;"></i> <span>connection error</span>`;
        }
      });

      // --- Password visibility toggle (additive, does not touch the form-submit logic above) ---
      (function () {
        const toggleBtn = document.getElementById("passwordToggle");
        const passwordInput = document.getElementById("password");
        if (!toggleBtn || !passwordInput) return;

        toggleBtn.addEventListener("click", () => {
          const isHidden = passwordInput.type === "password";
          passwordInput.type = isHidden ? "text" : "password";

          const icon = toggleBtn.querySelector("i");
          if (icon) {
            icon.classList.toggle("fa-eye", !isHidden);
            icon.classList.toggle("fa-eye-slash", isHidden);
          }

          toggleBtn.setAttribute("aria-pressed", String(isHidden));
          toggleBtn.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password"
          );
        });
      })();
    </script>
  </body>
</html>
