<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Your Account — OJ || studios</title>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="acc.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="logo">OJ || studios</a>
      <button class="logout-btn" id="logoutBtn">
        <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
        <span>logout</span>
      </button>
    </nav>

    <div class="account-container">
      <div class="welcome-header">
        <h1>my account</h1>
        <p>welcome back, <span id="userNameDisplay"></span></p>
      </div>

      <div class="account-grid">
        <!-- Sidebar -->
        <aside class="account-sidebar">
          <nav class="sidebar-nav" aria-label="account sections">
            <button class="sidebar-item active" data-tab="profile">
              <i class="fa-regular fa-user" aria-hidden="true"></i> profile
            </button>
            <button class="sidebar-item" data-tab="orders">
              <i class="fa-solid fa-gift" aria-hidden="true"></i> orders
            </button>
            <button class="sidebar-item" data-tab="tracking">
              <i class="fa-solid fa-truck" aria-hidden="true"></i> track order
            </button>
            <button class="sidebar-item" data-tab="addresses">
              <i class="fa-solid fa-location-dot" aria-hidden="true"></i> addresses
            </button>
            <button class="sidebar-item" data-tab="security">
              <i class="fa-solid fa-lock" aria-hidden="true"></i> security
            </button>
          </nav>
        </aside>

        <!-- Main Content -->
        <main class="account-main" id="accountMain">
          <!-- Profile Tab -->
          <div id="profile-tab" class="tab-content">
            <h2 class="section-title">profile information</h2>
            <form class="profile-form" id="profileForm">
              <div class="form-row">
                <div class="form-group">
                  <label for="profileFirstName">first name</label>
                  <input type="text" id="profileFirstName" disabled />
                </div>
                <div class="form-group">
                  <label for="profileSurname">surname</label>
                  <input type="text" id="profileSurname" disabled />
                </div>
              </div>
              <div class="form-group">
                <label for="profileEmail">email</label>
                <input type="email" id="profileEmail" disabled />
              </div>
              <div class="form-actions">
                <button type="button" class="btn-primary" id="editProfileBtn">
                  edit profile
                </button>
                <button
                  type="submit"
                  class="btn-primary"
                  id="saveProfileBtn"
                  style="display: none"
                >
                  save changes
                </button>
              </div>
            </form>
          </div>

          <!-- Orders Tab -->
          <div id="orders-tab" class="tab-content" style="display: none">
            <h2 class="section-title">order history</h2>
            <div class="orders-table-wrap">
              <div id="ordersContainer" aria-live="polite"></div>
            </div>
          </div>

          <!-- Tracking Tab -->
          <div id="tracking-tab" class="tab-content" style="display: none">
            <h2 class="section-title">track your order</h2>
            <div class="tracking-section">
              <p>enter your order reference to check status</p>
              <div class="tracking-input-group">
                <label for="trackingReference" class="visually-hidden"
                  >order reference</label
                >
                <input
                  type="text"
                  id="trackingReference"
                  class="tracking-input"
                  placeholder="e.g., TREY-1775509190674-85680"
                />
                <button class="btn-primary" id="trackOrderBtn">
                  track order
                </button>
              </div>
              <div id="trackingResult" aria-live="polite"></div>
            </div>
          </div>

          <!-- Addresses Tab -->
          <div id="addresses-tab" class="tab-content" style="display: none">
            <h2 class="section-title">saved addresses</h2>
            <div id="addressesContainer" aria-live="polite"></div>
          </div>

          <!-- Security Tab -->
          <div id="security-tab" class="tab-content" style="display: none">
            <h2 class="section-title">change password</h2>
            <form class="profile-form" id="passwordForm">
              <div class="form-group">
                <label for="currentPassword">current password</label>
                <input type="password" id="currentPassword" required />
              </div>
              <div class="form-group">
                <label for="newPassword">new password</label>
                <input type="password" id="newPassword" required />
              </div>
              <div class="form-group">
                <label for="confirmPassword">confirm new password</label>
                <input type="password" id="confirmPassword" required />
              </div>
              <div class="form-actions">
                <button type="submit" class="btn-primary">
                  update password
                </button>
              </div>
            </form>

            <div class="danger-zone">
              <h4>danger zone</h4>
              <p class="danger-zone-copy">
                this permanently deletes your account and all associated
                data. this cannot be undone.
              </p>
              <button class="btn-danger" id="deleteAccountBtn">
                delete my account
              </button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="app-core.js"></script>
    <script>
      // ========================================
      // AUTH CHECK - REDIRECT IF NOT LOGGED IN
      // ========================================
      const userId = sessionStorage.getItem("userId");
      const userName = sessionStorage.getItem("userName");

      if (!userId) {
        window.location.href = "index.html";
      }

      document.getElementById("userNameDisplay").textContent =
        userName || "User";

      // ========================================
      // LOGOUT
      // ========================================
      document.getElementById("logoutBtn").addEventListener("click", () => {
        sessionStorage.removeItem("userId");
        sessionStorage.removeItem("userName");
        sessionStorage.removeItem("userEmail");
        sessionStorage.removeItem("userPhone");
        window.location.href = "index.html";
      });

      // ========================================
      // TAB NAVIGATION
      // ========================================
      const tabs = document.querySelectorAll(".sidebar-item");
      const tabContents = document.querySelectorAll(".tab-content");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const tabId = tab.dataset.tab;

          tabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");

          tabContents.forEach((content) => (content.style.display = "none"));
          document.getElementById(`${tabId}-tab`).style.display = "block";

          // Load data when tab is opened
          if (tabId === "orders") loadOrders();
          if (tabId === "addresses") loadAddresses();
        });
      });

      // ========================================
      // PROFILE FUNCTIONS
      // ========================================
      async function loadProfile() {
        try {
          const response = await OJ.api("/ojuser", { method: "POST", body: { userId } });
          const user = await response.json();

          document.getElementById("profileFirstName").value =
            user.first_name || "";
          document.getElementById("profileSurname").value = user.surname || "";
          document.getElementById("profileEmail").value = user.email || "";
        } catch (err) {
          console.error("Load profile error:", err);
        }
      }

      document
        .getElementById("editProfileBtn")
        .addEventListener("click", () => {
          const inputs = document.querySelectorAll("#profileForm input");
          inputs.forEach((input) => (input.disabled = false));
          document.getElementById("editProfileBtn").style.display = "none";
          document.getElementById("saveProfileBtn").style.display = "block";
        });

      document
        .getElementById("profileForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const updatedData = {
            userId,
            first_name: document.getElementById("profileFirstName").value,
            surname: document.getElementById("profileSurname").value,
            email: document.getElementById("profileEmail").value,
          };

          try {
            const response = await OJ.api("/ojuser/update", { method: "PUT", body: updatedData });

            if (response.ok) {
              OJ.toast("Profile updated.", "success");
              const inputs = document.querySelectorAll("#profileForm input");
              inputs.forEach((input) => (input.disabled = true));
              document.getElementById("editProfileBtn").style.display = "block";
              document.getElementById("saveProfileBtn").style.display = "none";
            } else {
              OJ.toast("Failed to update profile.", "error");
            }
          } catch (err) {
            console.error("Update profile error:", err);
            OJ.toast("Error updating profile.", "error");
          }
        });

      // ========================================
      // ORDERS FUNCTIONS
      // ========================================
      async function loadOrders() {
        const container = document.getElementById("ordersContainer");
        container.innerHTML =
          '<div class="empty-state">loading orders...</div>';

        try {
          const response = await OJ.api("/ojorders", { method: "POST", body: { userId } });

          const orders = await response.json();

          if (!orders || orders.length === 0) {
            container.innerHTML =
              '<div class="empty-state">no orders yet</div>';
            return;
          }

          let html = `
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>items</th>
                                <th>reference</th>
                                <th>total</th>
                                <th>status</th>
                                <th>action</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

          for (const order of orders) {
            // Fetch order items
            const itemsResponse = await OJ.api("/ojorderitems", { method: "POST", body: { orderId: order.id } });
            const items = await itemsResponse.json();
            const firstItem = items[0];

            const statusClass = `status-${OJ.escapeHtml(order.status || "pending")}`;

            html += `
                        <tr>
                            <td>
                                ${
                                  firstItem
                                    ? `<img src="${OJ.safeUrl(firstItem.img_url, OJ.BRAND_FALLBACK)}" class="order-img" alt="${OJ.escapeHtml(firstItem.product_name)}">`
                                    : "-"
                                }
                            </td>
                            <td>${OJ.escapeHtml(order.payment_reference || "-")}</td>
                            <td>${OJ.money(order.total_amount)}</td>
                            <td><span class="status-badge ${statusClass}">${
              order.status || "pending"
            }</span></td>
                            <td><button class="order-action" onclick="viewOrder(${
                              order.id
                            })">view details</button></td>
                        </tr>
                    `;
          }

          html += `</tbody></table>`;
          container.innerHTML = html;
        } catch (err) {
          console.error("Load orders error:", err);
          container.innerHTML =
            '<div class="empty-state">failed to load orders</div>';
        }
      }

      window.viewOrder = async (orderId) => {
        try {
          const itemsResponse = await OJ.api("/ojorderitems", { method: "POST", body: { orderId } });
          const items = await itemsResponse.json();

          let itemsHtml = '<div class="order-items-list">';
          items.forEach((item) => {
            itemsHtml += `
                        <div class="order-item-row">
                            <img src="${
                              item.img_url
                            }" class="order-item-img" alt="${
              item.product_name
            }">
                            <div><strong>${
                              item.product_name
                            }</strong><br>Qty: ${OJ.escapeHtml(item.quantity)} | Size: ${
              item.size || "N/A"
            }</div>
                            <div>${OJ.money(item.product_price)}</div>
                        </div>
                    `;
          });
          itemsHtml += "</div>";

          showModal("Order Details", itemsHtml);
        } catch (err) {
          console.error("View order error:", err);
          OJ.toast("Failed to load order details.", "error");
        }
      };

      // ========================================
      // TRACKING FUNCTIONS
      // ========================================
      // TRACK ORDER - SHOWS COMPLETE ORDER DETAILS WITH ITEMS
      document
        .getElementById("trackOrderBtn")
        .addEventListener("click", async () => {
          const reference = document
            .getElementById("trackingReference")
            .value.trim();
          const resultDiv = document.getElementById("trackingResult");

          if (!reference) {
            resultDiv.innerHTML =
              '<div class="tracking-result" style="color: #c62828;">please enter a reference</div>';
            return;
          }

          resultDiv.innerHTML =
            '<div class="tracking-result">🔍 searching for order...</div>';

          try {
            const response = await OJ.api("/ojtrack", { method: "POST", body: { reference, userId } });

            const result = await response.json();

            if (result.order) {
              const order = result.order;
              const statusClass = `status-${OJ.escapeHtml(order.status || "pending")}`;
              const statusText = order.status || "pending";

              // Format status display
              let statusDisplay = "";
              switch (statusText) {
                case "pending":
                  statusDisplay = "🟡 Pending - Preparing Order";
                  break;
                case "confirmed":
                  statusDisplay =
                    "🔵 Confirmed - Order Prepared , Getting ready to ship";
                  break;
                case "shipped":
                  statusDisplay = "🟠 Shipped - On its way!";
                  break;
                case "delivered":
                  statusDisplay = "🟢 Delivered - Enjoy your order!";
                  break;
                default:
                  statusDisplay = statusText;
              }

              // Build items HTML
              let itemsHtml = "";
              if (result.items && result.items.length > 0) {
                itemsHtml =
                  '<div style="margin-top: 20px;"><h4 style="margin-bottom: 15px;">🛍️ Order Items</h4>';
                itemsHtml += '<div style="border: 1px solid #eaeae4;">';

                result.items.forEach((item) => {
                  itemsHtml += `
                        <div style="display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid #efefe9;">
                            ${
                              item.img_url
                                ? `<img src="${OJ.safeUrl(item.img_url, OJ.BRAND_FALLBACK)}" style="width: 60px; height: 70px; object-fit: cover;" alt="${OJ.escapeHtml(item.product_name)}">`
                                : '<div style="width: 60px; height: 70px; background: #f9f9f6; display: flex; align-items: center; justify-content: center;">📦</div>'
                            }
                            <div style="flex: 1;">
                                <strong style="font-size: 1rem;">${
                                  item.product_name
                                }</strong><br>
                                <span style="color: #6f6f69; font-size: 0.85rem;">Size: ${
                                  item.size || "N/A"
                                } | Quantity: ${OJ.escapeHtml(item.quantity)}</span>
                            </div>
                            <div style="font-weight: 500; color: #c9a46c;">${OJ.money(item.product_price)}</div>
                        </div>
                    `;
                });

                // Calculate subtotal
                const subtotal = result.items.reduce(
                  (sum, item) => sum + item.product_price * item.quantity,
                  0
                );
                itemsHtml += `
                    <div style="display: flex; justify-content: flex-end; padding: 15px; background: #f9f9f6;">
                        <div><strong>Total:</strong> <span style="color: #c9a46c;">${OJ.money(subtotal)}</span></div>
                    </div>
                `;
                itemsHtml += "</div></div>";
              } else {
                itemsHtml =
                  '<p style="color: #8a8a84; margin-top: 15px;">No items found for this order.</p>';
              }

              // Full address display
              let fullAddress = "";
              if (order.delivery_address) {
                fullAddress = order.delivery_address;
                if (order.city) fullAddress += `, ${OJ.escapeHtml(order.city)}`;
                if (order.region) fullAddress += `, ${OJ.escapeHtml(order.region)}`;
                if (order.country) fullAddress += `, ${OJ.escapeHtml(order.country)}`;
                if (order.postal_code) fullAddress += ` (${OJ.escapeHtml(order.postal_code)})`;
              }

              resultDiv.innerHTML = `
                <div class="tracking-result" style="margin-top: 20px;">
                    <!-- Order Header -->
                    <div style="background: #f9f9f6; padding: 15px; margin-bottom: 20px;">
                        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                            <div>
                                <p style="color: #6f6f69; font-size: 12px; margin-bottom: 5px;">ORDER REFERENCE</p>
                                <p style="font-weight: 600; font-family: monospace;">${
                                  order.payment_reference || reference
                                }</p>
                            </div>
                            <div>
                                <p style="color: #6f6f69; font-size: 12px; margin-bottom: 5px;">ORDER DATE</p>
                                <p>${new Date(
                                  order.created_at
                                ).toLocaleDateString()}</p>
                            </div>
                            <div>
                                <p style="color: #6f6f69; font-size: 12px; margin-bottom: 5px;">ORDER STATUS</p>
                                <span class="status-badge ${statusClass}">${statusDisplay}</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Customer Information -->
                    <div style="margin-bottom: 20px;">
                        <h4 style="margin-bottom: 10px;">👤 Customer Information</h4>
                        <div style="background: #f9f9f6; padding: 15px;">
                            <p><strong>Name:</strong> ${
                              order.full_name || "N/A"
                            }</p>
                            <p><strong>Email:</strong> ${
                              order.email || "N/A"
                            }</p>
                            <p><strong>Phone:</strong> ${
                              order.phone || "N/A"
                            }</p>
                        </div>
                    </div>
                    
                    <!-- Delivery Address -->
                    <div style="margin-bottom: 20px;">
                        <h4 style="margin-bottom: 10px;">📍 Delivery Address</h4>
                        <div style="background: #f9f9f6; padding: 15px;">
                            <p>${
                              fullAddress ||
                              order.delivery_address ||
                              "No address provided"
                            }</p>
                            ${
                              order.delivery_instructions
                                ? `<p><strong>Instructions:</strong> ${OJ.escapeHtml(order.delivery_instructions)}</p>`
                                : ""
                            }
                        </div>
                    </div>
                    
                    <!-- Order Items -->
                    ${itemsHtml}
                </div>
            `;
            } else {
              resultDiv.innerHTML = `<div class="tracking-result" style="color: #c62828;">❌ ${
                result.message || "Order not found with this reference"
              }</div>`;
            }
          } catch (err) {
            console.error("Tracking error:", err);
            resultDiv.innerHTML =
              '<div class="tracking-result" style="color: #c62828;">❌ Error searching for order. Please try again.</div>';
          }
        });

      // ========================================
      // ADDRESSES FUNCTIONS
      // ========================================
      async function loadAddresses() {
        const container = document.getElementById("addressesContainer");
        container.innerHTML =
          '<div class="empty-state">loading addresses...</div>';

        try {
          const response = await OJ.api("/ojuser/address", { method: "POST", body: { userId } });

          const addresses = await response.json();

          if (!addresses || addresses.length === 0) {
            container.innerHTML =
              '<div class="empty-state">no saved addresses</div>';
            return;
          }

          let html = "";
          addresses.forEach((addr) => {
            html += `
                        <div class="address-card">
                            <p><strong>${OJ.escapeHtml(addr.full_name || "N/A")}</strong></p>
                            <p>${OJ.escapeHtml(addr.street_address || "")} ${
              addr.apartment || ""
            }</p>
                            <p>${OJ.escapeHtml(addr.city || "")}, ${OJ.escapeHtml(addr.region || "")} ${
              addr.postal_code || ""
            }</p>
                            <p>${OJ.escapeHtml(addr.country || "Ghana")}</p>
                            <p>phone: ${OJ.escapeHtml(addr.phone || "N/A")}</p>
                        </div>
                    `;
          });
          container.innerHTML = html;
        } catch (err) {
          console.error("Load addresses error:", err);
          container.innerHTML =
            '<div class="empty-state">failed to load addresses</div>';
        }
      }

      // ========================================
      // PASSWORD CHANGE
      // ========================================
      document
        .getElementById("passwordForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const currentPassword =
            document.getElementById("currentPassword").value;
          const newPassword = document.getElementById("newPassword").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (newPassword !== confirmPassword) {
            OJ.toast("New passwords do not match.", "error");
            return;
          }

          if (newPassword.length < 8) {
            OJ.toast("Password must be at least 8 characters.", "error");
            return;
          }

          try {
            const response = await OJ.api("/ojuser/password", { method: "PUT", body: { userId, currentPassword, newPassword } });

            const result = await response.json();

            if (response.ok) {
              OJ.toast("Password updated.", "success");
              document.getElementById("passwordForm").reset();
            } else {
              OJ.toast(result.message || "Failed to update password.", "error");
            }
          } catch (err) {
            console.error("Password change error:", err);
            OJ.toast("Error changing password.", "error");
          }
        });

      // ========================================
      // DELETE ACCOUNT
      // ========================================
      document
        .getElementById("deleteAccountBtn")
        .addEventListener("click", () => {
          if (
            confirm(
              "⚠️ Are you sure? This action cannot be undone. All your data will be permanently deleted."
            )
          ) {
            const password = prompt(
              "Please enter your password to confirm account deletion:"
            );
            if (password) {
              deleteAccount(password);
            }
          }
        });

      async function deleteAccount(password) {
        try {
          const response = await OJ.api("/ojuser/delete", { method: "DELETE", body: { userId, password } });

          const result = await response.json();

          if (response.ok) {
            OJ.toast("Account deleted.", "success");
            sessionStorage.clear();
            window.location.href = "index.html";
          } else {
            OJ.toast(result.message || "Failed to delete account.", "error");
          }
        } catch (err) {
          console.error("Delete account error:", err);
          OJ.toast("Error deleting account.", "error");
        }
      }

      // ========================================
      // MODAL FUNCTION
      // ========================================
      function showModal(title, content) {
        const existingModal = document.querySelector(".modal");
        if (existingModal) existingModal.remove();

        const modal = document.createElement("div");
        modal.className = "modal";
        modal.innerHTML = `
                <div class="modal-content">
                    <h3>${title}</h3>
                    <div>${content}</div>
                    <div class="modal-buttons">
                        <button class="btn-secondary" onclick="this.closest('.modal').remove()">close</button>
                    </div>
                </div>
            `;
        document.body.appendChild(modal);
      }

      // ========================================
      // INITIAL LOAD
      // ========================================
      loadProfile();
    </script>
  </body>
</html>
