<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TREY · My Account</title>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        background: #fafaf8;
        color: #1e1e1e;
        line-height: 1.5;
      }

      /* Navbar */
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem 5%;
        background: #ffffffd9;
        backdrop-filter: blur(8px);
        border-bottom: 1px solid #eaeae7;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .logo {
        font-size: 1.8rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #252523;
        text-decoration: none;
      }

      .logo span {
        font-weight: 280;
        color: #7c7c7a;
      }

      .logout-btn {
        background: transparent;
        border: 1px solid #e2e2db;
        padding: 0.6rem 1.5rem;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s;
        color: #4f4f4b;
      }

      .logout-btn:hover {
        background: #232321;
        color: white;
        border-color: #232321;
      }

      /* Main Container */
      .account-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 3rem 5%;
      }

      /* Welcome Header */
      .welcome-header {
        margin-bottom: 2.5rem;
      }

      .welcome-header h1 {
        font-size: 2rem;
        font-weight: 380;
        letter-spacing: -0.02em;
        color: #252523;
      }

      .welcome-header p {
        color: #6f6f69;
        margin-top: 0.3rem;
      }

      /* Account Grid */
      .account-grid {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 2.5rem;
      }

      /* Sidebar */
      .account-sidebar {
        background: #ffffff;
        border: 1px solid #eaeae4;
        padding: 1.5rem;
        height: fit-content;
        position: sticky;
        top: 100px;
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      .sidebar-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.9rem 1rem;
        background: transparent;
        border: none;
        width: 100%;
        text-align: left;
        font-size: 0.95rem;
        font-weight: 400;
        color: #4f4f4b;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }

      .sidebar-item i {
        width: 22px;
        color: #b5b5ad;
        font-size: 1.1rem;
      }

      .sidebar-item:hover {
        background: #f9f9f6;
        color: #252523;
      }

      .sidebar-item.active {
        background: #f9f9f6;
        color: #c9a46c;
        border-left: 3px solid #c9a46c;
      }

      .sidebar-item.active i {
        color: #c9a46c;
      }

      /* Main Content */
      .account-main {
        background: #ffffff;
        border: 1px solid #eaeae4;
        padding: 2rem;
      }

      .section-title {
        font-size: 1.4rem;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: #252523;
        margin-bottom: 1.5rem;
        padding-bottom: 0.8rem;
        border-bottom: 1px solid #efefe9;
      }

      /* Profile Form */
      .profile-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        max-width: 500px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .form-group label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #4a4a46;
      }

      .form-group input {
        padding: 0.8rem;
        background: #f9f9f6;
        border: 1px solid #e2e2db;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.2s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #c9a46c;
        background: #ffffff;
      }

      .form-group input:disabled {
        background: #efefe9;
        color: #8a8a84;
      }

      .btn-primary {
        background: #232321;
        border: 1px solid #232321;
        color: white;
        padding: 0.9rem 1.8rem;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        width: fit-content;
      }

      .btn-primary:hover {
        background: #3b3b38;
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid #e2e2db;
        color: #4f4f4b;
        padding: 0.9rem 1.8rem;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }

      .btn-secondary:hover {
        border-color: #232321;
        color: #232321;
      }

      /* Orders Table */
      .orders-table {
        width: 100%;
        border-collapse: collapse;
      }

      .orders-table th,
      .orders-table td {
        padding: 1rem 0.8rem;
        text-align: left;
        border-bottom: 1px solid #efefe9;
      }

      .orders-table th {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #6f6f69;
        font-weight: 400;
      }

      .order-img {
        width: 50px;
        height: 60px;
        object-fit: cover;
      }

      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.7rem;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-radius: 20px;
      }

      .status-pending {
        background: #fff3e0;
        color: #e6a017;
      }

      .status-confirmed {
        background: #e3f2fd;
        color: #1565c0;
      }

      .status-shipped {
        background: #fff8e1;
        color: #f57c00;
      }

      .status-delivered {
        background: #e8f5e9;
        color: #2e7d32;
      }

      .order-action {
        background: none;
        border: none;
        color: #c9a46c;
        cursor: pointer;
        font-size: 0.85rem;
        font-family: inherit;
      }

      .order-action:hover {
        text-decoration: underline;
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 3rem;
        color: #8a8a84;
      }

      /* Address Card */
      .address-card {
        background: #f9f9f6;
        padding: 1.5rem;
        border: 1px solid #eaeae4;
        margin-bottom: 1.5rem;
      }

      .address-card p {
        margin-bottom: 0.5rem;
        color: #4f4f4b;
      }

      /* Danger Zone */
      .danger-zone {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #ffebee;
      }

      .danger-zone h4 {
        color: #c62828;
        margin-bottom: 1rem;
      }

      .btn-danger {
        background: transparent;
        border: 1px solid #c62828;
        color: #c62828;
        padding: 0.8rem 1.5rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-danger:hover {
        background: #c62828;
        color: white;
      }

      /* Modal */
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .modal-content {
        background: #ffffff;
        max-width: 500px;
        width: 90%;
        padding: 2rem;
        border: 1px solid #eaeae4;
      }

      .modal-content h3 {
        margin-bottom: 1rem;
      }

      .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      /* Order Details */
      .order-details {
        margin-top: 1rem;
      }

      .order-items-list {
        margin-top: 1rem;
      }

      .order-item-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.8rem 0;
        border-bottom: 1px solid #efefe9;
      }

      .order-item-img {
        width: 50px;
        height: 60px;
        object-fit: cover;
      }

      /* Tracking */
      .tracking-section {
        margin-top: 1rem;
      }

      .tracking-input-group {
        display: flex;
        gap: 1rem;
        margin-top: 1rem;
      }

      .tracking-input {
        flex: 1;
        padding: 0.8rem;
        border: 1px solid #e2e2db;
        font-family: inherit;
      }

      .tracking-result {
        margin-top: 1rem;
        padding: 1rem;
        background: #f9f9f6;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .account-grid {
          grid-template-columns: 1fr;
        }

        .account-sidebar {
          position: static;
        }

        .sidebar-nav {
          flex-direction: row;
          flex-wrap: wrap;
        }

        .sidebar-item {
          width: auto;
        }

        .orders-table {
          display: block;
          overflow-x: auto;
        }

        .tracking-input-group {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="logo">TREY <span>studio</span></a>
      <button class="logout-btn" id="logoutBtn">logout</button>
    </nav>

    <div class="account-container">
      <div class="welcome-header">
        <h1>my account</h1>
        <p>welcome back, <span id="userNameDisplay"></span></p>
      </div>

      <div class="account-grid">
        <!-- Sidebar -->
        <aside class="account-sidebar">
          <div class="sidebar-nav">
            <button class="sidebar-item active" data-tab="profile">
              <i class="fa-regular fa-user"></i> profile
            </button>
            <button class="sidebar-item" data-tab="orders">
              <i class="fa-regular fa-box"></i> orders
            </button>
            <button class="sidebar-item" data-tab="tracking">
              <i class="fa-regular fa-truck"></i> track order
            </button>
            <button class="sidebar-item" data-tab="addresses">
              <i class="fa-regular fa-location-dot"></i> addresses
            </button>
            <button class="sidebar-item" data-tab="security">
              <i class="fa-regular fa-lock"></i> security
            </button>
          </div>
        </aside>

        <!-- Main Content -->
        <main class="account-main" id="accountMain">
          <!-- Profile Tab -->
          <div id="profile-tab" class="tab-content">
            <h2 class="section-title">profile information</h2>
            <form class="profile-form" id="profileForm">
              <div class="form-group">
                <label>first name</label>
                <input type="text" id="profileFirstName" disabled />
              </div>
              <div class="form-group">
                <label>surname</label>
                <input type="text" id="profileSurname" disabled />
              </div>
              <div class="form-group">
                <label>email</label>
                <input type="email" id="profileEmail" disabled />
              </div>
              <button type="button" class="btn-primary" id="editProfileBtn">
                edit profile
              </button>
              <button
                type="submit"
                class="btn-primary"
                id="saveProfileBtn"
                style="display: none"
              >
                save changes
              </button>
            </form>
          </div>

          <!-- Orders Tab -->
          <div id="orders-tab" class="tab-content" style="display: none">
            <h2 class="section-title">order history</h2>
            <div id="ordersContainer"></div>
          </div>

          <!-- Tracking Tab -->
          <div id="tracking-tab" class="tab-content" style="display: none">
            <h2 class="section-title">track your order</h2>
            <div class="tracking-section">
              <p>enter your order reference to check status</p>
              <div class="tracking-input-group">
                <input
                  type="text"
                  id="trackingReference"
                  class="tracking-input"
                  placeholder="e.g., TREY-1775509190674-85680"
                />
                <button class="btn-primary" id="trackOrderBtn">
                  track order
                </button>
              </div>
              <div id="trackingResult"></div>
            </div>
          </div>

          <!-- Addresses Tab -->
          <div id="addresses-tab" class="tab-content" style="display: none">
            <h2 class="section-title">saved addresses</h2>
            <div id="addressesContainer"></div>
          </div>

          <!-- Security Tab -->
          <div id="security-tab" class="tab-content" style="display: none">
            <h2 class="section-title">change password</h2>
            <form class="profile-form" id="passwordForm">
              <div class="form-group">
                <label>current password</label>
                <input type="password" id="currentPassword" required />
              </div>
              <div class="form-group">
                <label>new password</label>
                <input type="password" id="newPassword" required />
              </div>
              <div class="form-group">
                <label>confirm new password</label>
                <input type="password" id="confirmPassword" required />
              </div>
              <button type="submit" class="btn-primary">update password</button>
            </form>

            <div class="danger-zone">
              <h4>danger zone</h4>
              <button class="btn-danger" id="deleteAccountBtn">
                delete my account
              </button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script>
      // ========================================
      // AUTH CHECK - REDIRECT IF NOT LOGGED IN
      // ========================================
      const userId = sessionStorage.getItem("userId");
      const userName = sessionStorage.getItem("userName");

      if (!userId) {
        window.location.href = "index.html";
      }

      document.getElementById("userNameDisplay").textContent =
        userName || "User";

      // ========================================
      // LOGOUT
      // ========================================
      document.getElementById("logoutBtn").addEventListener("click", () => {
        sessionStorage.removeItem("userId");
        sessionStorage.removeItem("userName");
        sessionStorage.removeItem("userEmail");
        sessionStorage.removeItem("userPhone");
        window.location.href = "index.html";
      });

      // ========================================
      // TAB NAVIGATION
      // ========================================
      const tabs = document.querySelectorAll(".sidebar-item");
      const tabContents = document.querySelectorAll(".tab-content");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const tabId = tab.dataset.tab;

          tabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");

          tabContents.forEach((content) => (content.style.display = "none"));
          document.getElementById(`${tabId}-tab`).style.display = "block";

          // Load data when tab is opened
          if (tabId === "orders") loadOrders();
          if (tabId === "addresses") loadAddresses();
        });
      });

      // ========================================
      // PROFILE FUNCTIONS
      // ========================================
      async function loadProfile() {
        try {
          const response = await fetch(
            "https://backendroutes-lcpt.onrender.com/ojuser",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ userId }),
            }
          );
          const user = await response.json();

          document.getElementById("profileFirstName").value =
            user.first_name || "";
          document.getElementById("profileSurname").value = user.surname || "";
          document.getElementById("profileEmail").value = user.email || "";
        } catch (err) {
          console.error("Load profile error:", err);
        }
      }

      document
        .getElementById("editProfileBtn")
        .addEventListener("click", () => {
          const inputs = document.querySelectorAll("#profileForm input");
          inputs.forEach((input) => (input.disabled = false));
          document.getElementById("editProfileBtn").style.display = "none";
          document.getElementById("saveProfileBtn").style.display = "block";
        });

      document
        .getElementById("profileForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const updatedData = {
            userId,
            first_name: document.getElementById("profileFirstName").value,
            surname: document.getElementById("profileSurname").value,
            email: document.getElementById("profileEmail").value,
          };

          try {
            const response = await fetch(
              "https://backendroutes-lcpt.onrender.com/ojuser/update",
              {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(updatedData),
              }
            );

            if (response.ok) {
              alert("Profile updated successfully");
              const inputs = document.querySelectorAll("#profileForm input");
              inputs.forEach((input) => (input.disabled = true));
              document.getElementById("editProfileBtn").style.display = "block";
              document.getElementById("saveProfileBtn").style.display = "none";
            } else {
              alert("Failed to update profile");
            }
          } catch (err) {
            console.error("Update profile error:", err);
            alert("Error updating profile");
          }
        });

      // ========================================
      // ORDERS FUNCTIONS
      // ========================================
      async function loadOrders() {
        const container = document.getElementById("ordersContainer");
        container.innerHTML =
          '<div class="empty-state">loading orders...</div>';

        try {
          const response = await fetch(
            "https://backendroutes-lcpt.onrender.com/ojorders",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ userId }),
            }
          );

          const orders = await response.json();

          if (!orders || orders.length === 0) {
            container.innerHTML =
              '<div class="empty-state">no orders yet</div>';
            return;
          }

          let html = `
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>items</th>
                                <th>reference</th>
                                <th>total</th>
                                <th>status</th>
                                <th>action</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

          for (const order of orders) {
            // Fetch order items
            const itemsResponse = await fetch(
              "https://backendroutes-lcpt.onrender.com/ojorderitems",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ orderId: order.id }),
              }
            );
            const items = await itemsResponse.json();
            const firstItem = items[0];

            const statusClass = `status-${order.payment_status || "pending"}`;

            html += `
                        <tr>
                            <td>
                                ${
                                  firstItem
                                    ? `<img src="${firstItem.img_url}" class="order-img" alt="${firstItem.product_name}">`
                                    : "-"
                                }
                            </td>
                            <td>${order.payment_reference || "-"}</td>
                            <td>$${parseFloat(order.total_amount).toFixed(
                              2
                            )}</td>
                            <td><span class="status-badge ${statusClass}">${
              order.payment_status || "pending"
            }</span></td>
                            <td><button class="order-action" onclick="viewOrder(${
                              order.id
                            })">view details</button></td>
                        </tr>
                    `;
          }

          html += `</tbody></table>`;
          container.innerHTML = html;
        } catch (err) {
          console.error("Load orders error:", err);
          container.innerHTML =
            '<div class="empty-state">failed to load orders</div>';
        }
      }

      window.viewOrder = async (orderId) => {
        try {
          const itemsResponse = await fetch(
            "https://backendroutes-lcpt.onrender.com/ojorderitems",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ orderId }),
            }
          );
          const items = await itemsResponse.json();

          let itemsHtml = '<div class="order-items-list">';
          items.forEach((item) => {
            itemsHtml += `
                        <div class="order-item-row">
                            <img src="${
                              item.img_url
                            }" class="order-item-img" alt="${
              item.product_name
            }">
                            <div><strong>${
                              item.product_name
                            }</strong><br>Qty: ${item.quantity} | Size: ${
              item.size || "N/A"
            }</div>
                            <div>$${parseFloat(item.product_price).toFixed(
                              2
                            )}</div>
                        </div>
                    `;
          });
          itemsHtml += "</div>";

          showModal("Order Details", itemsHtml);
        } catch (err) {
          console.error("View order error:", err);
          alert("Failed to load order details");
        }
      };

      // ========================================
      // TRACKING FUNCTIONS
      // ========================================
      document
        .getElementById("trackOrderBtn")
        .addEventListener("click", async () => {
          const reference = document
            .getElementById("trackingReference")
            .value.trim();
          const resultDiv = document.getElementById("trackingResult");

          if (!reference) {
            resultDiv.innerHTML =
              '<div class="tracking-result" style="color: #c62828;">please enter a reference</div>';
            return;
          }

          resultDiv.innerHTML =
            '<div class="tracking-result">searching...</div>';

          try {
            const response = await fetch(
              "https://backendroutes-lcpt.onrender.com/ojtrack",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ reference, userId }),
              }
            );

            const result = await response.json();

            if (result.order) {
              const statusClass = `status-${
                result.order.payment_status || "pending"
              }`;
              resultDiv.innerHTML = `
                        <div class="tracking-result">
                            <p><strong>order reference:</strong> ${
                              result.order.payment_reference
                            }</p>
                            <p><strong>status:</strong> <span class="status-badge ${statusClass}">${
                result.order.payment_status || "pending"
              }</span></p>
                            <p><strong>order date:</strong> ${new Date(
                              result.order.created_at
                            ).toLocaleDateString()}</p>
                            <p><strong>total:</strong> $${parseFloat(
                              result.order.total_amount
                            ).toFixed(2)}</p>
                            <p><strong>delivery address:</strong> ${
                              result.order.delivery_address || "N/A"
                            }</p>
                        </div>
                    `;
            } else {
              resultDiv.innerHTML = `<div class="tracking-result" style="color: #c62828;">${
                result.message || "order not found"
              }</div>`;
            }
          } catch (err) {
            console.error("Tracking error:", err);
            resultDiv.innerHTML =
              '<div class="tracking-result" style="color: #c62828;">error searching for order</div>';
          }
        });

      // ========================================
      // ADDRESSES FUNCTIONS
      // ========================================
      async function loadAddresses() {
        const container = document.getElementById("addressesContainer");
        container.innerHTML =
          '<div class="empty-state">loading addresses...</div>';

        try {
          const response = await fetch(
            "https://backendroutes-lcpt.onrender.com/ojuser/address",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ userId }),
            }
          );

          const addresses = await response.json();

          if (!addresses || addresses.length === 0) {
            container.innerHTML =
              '<div class="empty-state">no saved addresses</div>';
            return;
          }

          let html = "";
          addresses.forEach((addr) => {
            html += `
                        <div class="address-card">
                            <p><strong>${addr.full_name || "N/A"}</strong></p>
                            <p>${addr.street_address || ""} ${
              addr.apartment || ""
            }</p>
                            <p>${addr.city || ""}, ${addr.region || ""} ${
              addr.postal_code || ""
            }</p>
                            <p>${addr.country || "Ghana"}</p>
                            <p>phone: ${addr.phone || "N/A"}</p>
                        </div>
                    `;
          });
          container.innerHTML = html;
        } catch (err) {
          console.error("Load addresses error:", err);
          container.innerHTML =
            '<div class="empty-state">failed to load addresses</div>';
        }
      }

      // ========================================
      // PASSWORD CHANGE
      // ========================================
      document
        .getElementById("passwordForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const currentPassword =
            document.getElementById("currentPassword").value;
          const newPassword = document.getElementById("newPassword").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (newPassword !== confirmPassword) {
            alert("New passwords do not match");
            return;
          }

          if (newPassword.length < 6) {
            alert("Password must be at least 6 characters");
            return;
          }

          try {
            const response = await fetch(
              "https://backendroutes-lcpt.onrender.com/ojuser/password",
              {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId, currentPassword, newPassword }),
              }
            );

            const result = await response.json();

            if (response.ok) {
              alert("Password updated successfully");
              document.getElementById("passwordForm").reset();
            } else {
              alert(result.message || "Failed to update password");
            }
          } catch (err) {
            console.error("Password change error:", err);
            alert("Error changing password");
          }
        });

      // ========================================
      // DELETE ACCOUNT
      // ========================================
      document
        .getElementById("deleteAccountBtn")
        .addEventListener("click", () => {
          if (
            confirm(
              "⚠️ Are you sure? This action cannot be undone. All your data will be permanently deleted."
            )
          ) {
            const password = prompt(
              "Please enter your password to confirm account deletion:"
            );
            if (password) {
              deleteAccount(password);
            }
          }
        });

      async function deleteAccount(password) {
        try {
          const response = await fetch(
            "https://backendroutes-lcpt.onrender.com/ojuser/delete",
            {
              method: "DELETE",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ userId, password }),
            }
          );

          const result = await response.json();

          if (response.ok) {
            alert("Account deleted successfully");
            sessionStorage.clear();
            window.location.href = "index.html";
          } else {
            alert(result.message || "Failed to delete account");
          }
        } catch (err) {
          console.error("Delete account error:", err);
          alert("Error deleting account");
        }
      }

      // ========================================
      // MODAL FUNCTION
      // ========================================
      function showModal(title, content) {
        const existingModal = document.querySelector(".modal");
        if (existingModal) existingModal.remove();

        const modal = document.createElement("div");
        modal.className = "modal";
        modal.innerHTML = `
                <div class="modal-content">
                    <h3>${title}</h3>
                    <div>${content}</div>
                    <div class="modal-buttons">
                        <button class="btn-secondary" onclick="this.closest('.modal').remove()">close</button>
                    </div>
                </div>
            `;
        document.body.appendChild(modal);
      }

      // ========================================
      // INITIAL LOAD
      // ========================================
      loadProfile();
    </script>
  </body>
</html>
